name: Windows.

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '!docs/building-win*.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/win.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.sh'
      - 'Telegram/Telegram.plist'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '!docs/building-win*.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/win.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.sh'
      - 'Telegram/Telegram.plist'

jobs:

  windows:
    name: Windows
    runs-on: windows-latest

    strategy:
      matrix:
        arch: [Win32, x64]
        generator: ["", "Ninja Multi-Config"]

    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v6
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          [ "${{ matrix.arch }}" != Win32 ] && DOCPATH=$TBUILD/$REPO_NAME/docs/building-win-${{ matrix.arch }}.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          echo "Configurate git for cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - uses: ilammy/msvc-dev-cmd@v1.13.0
        name: Native Tools Command Prompt.
        with:
          arch: ${{ matrix.arch }}
          sdk: ${{ env.SDK }}

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ matrix.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\Libraries
          key: ${{ runner.OS }}-${{ matrix.arch }}-libs-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-libs-

      - name: Libraries.
        env:
          GYP_MSVS_OVERRIDE_PATH: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\'
          GYP_MSVS_VERSION: 2022
        run: |
          cd %TBUILD%
          %REPO_NAME%\Telegram\build\prepare\win.bat skip-release silent

      - name: Read configuration matrix.
        shell: bash
        run: |
          ARTIFACT_NAME="Telegram"

          ARCH=""
          if [ -n "${{ matrix.arch }}" ]; then
            case "${{ matrix.arch }}" in
              Win32) ARCH="x86";;
              *) ARCH="${{ matrix.arch }}";;
            esac
            echo "Architecture from matrix: $ARCH"
            ARTIFACT_NAME="${ARTIFACT_NAME}_${{ matrix.arch }}"
          fi

          GENERATOR=""
          if [ -n "${{ matrix.generator }}" ]; then
            GENERATOR="-G \"${{ matrix.generator }}\""
            echo "Generator from matrix: $GENERATOR"
            ARTIFACT_NAME="${ARTIFACT_NAME}_${{ matrix.generator }}"
          fi
          echo "TDESKTOP_BUILD_GENERATOR=$GENERATOR" >> $GITHUB_ENV

          [ -n "$GENERATOR" ] && ARCH=""
          echo "TDESKTOP_BUILD_ARCH=$ARCH" >> $GITHUB_ENV

          DEFINE=""
          if [ -n "${{ matrix.defines }}" ]; then
            DEFINE="-D ${{ matrix.defines }}=ON"
            echo "Define from matrix: $DEFINE"
            ARTIFACT_NAME="${ARTIFACT_NAME}_${{ matrix.defines }}"
          fi
          echo "TDESKTOP_BUILD_DEFINE=$DEFINE" >> $GITHUB_ENV

          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV

          API="-D TDESKTOP_API_TEST=ON"
          if [ $GITHUB_REF == 'refs/heads/nightly' ]; then
            echo "Use the open credentials."
            API="-D TDESKTOP_API_ID=611335 -D TDESKTOP_API_HASH=d524b414d21f4d37f08684c1df41ac9c"
          fi
          echo "TDESKTOP_BUILD_API=$API" >> $GITHUB_ENV

      - name: Free up some disk space.
        run: |
          cd %TBUILD%
          del /S Libraries\*.pdb
          del /S Libraries\*.pch
          del /S Libraries\*.obj

      - name: Telegram Desktop build.
        if: env.ONLY_CACHE == 'false'
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          %TDESKTOP_BUILD_GENERATOR% ^
          %TDESKTOP_BUILD_ARCH% ^
          %TDESKTOP_BUILD_API% ^
          -D CMAKE_CONFIGURATION_TYPES="Debug;Release" ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=ON ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF ^
          %TDESKTOP_BUILD_DEFINE%

          cmake --build ..\out --config Debug --parallel
          cmake --build ..\out --config Release --parallel

      - name: Install Inno Setup.
        if: ((env.UPLOAD_ARTIFACT == 'true') || (github.ref == 'refs/heads/nightly')) && (matrix.generator == '')
        run: |
          choco install innosetup -y

      - name: Read version information.
        if: ((env.UPLOAD_ARTIFACT == 'true') || (github.ref == 'refs/heads/nightly')) && (matrix.generator == '')
        shell: bash
        run: |
          cd $TBUILD/$REPO_NAME/Telegram/build
          AppVersionStrSmall=$(awk '/^AppVersionStrSmall / {print $2}' version)
          AppVersionStr=$(awk '/^AppVersionStr[[:space:]]/ {print $2}' version)
          AppVersionStrFull="$AppVersionStr"
          echo "APP_VERSION_STR_SMALL=$AppVersionStrSmall" >> $GITHUB_ENV
          echo "APP_VERSION_STR=$AppVersionStr" >> $GITHUB_ENV
          echo "APP_VERSION_STR_FULL=$AppVersionStrFull" >> $GITHUB_ENV

      - name: Create installer with Inno Setup.
        if: ((env.UPLOAD_ARTIFACT == 'true') || (github.ref == 'refs/heads/nightly')) && (matrix.generator == '')
        run: |
          set "ReleasePath=%TBUILD%\%REPO_NAME%\out\Release"
          set "SetupScript=%TBUILD%\%REPO_NAME%\Telegram\build\setup.iss"
          
          REM Determine build target
          if "${{ matrix.arch }}" == "x64" (
            set "BuildTarget=win64"
          ) else if "${{ matrix.arch }}" == "Win32" (
            set "BuildTarget=win"
          ) else (
            set "BuildTarget=win"
          )
          
          REM Find Inno Setup compiler
          if exist "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" (
            set "ISCC=C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          ) else if exist "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" (
            set "ISCC=%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe"
          ) else (
            echo ERROR: Inno Setup compiler not found
            exit /b 1
          )
          
          REM Compile installer with Inno Setup
          "%ISCC%" ^
            /dMyAppVersion=${{ env.APP_VERSION_STR_SMALL }} ^
            /dMyAppVersionZero=${{ env.APP_VERSION_STR }} ^
            /dMyAppVersionFull=${{ env.APP_VERSION_STR_FULL }} ^
            /dReleasePath=%ReleasePath% ^
            /dMyBuildTarget=%BuildTarget% ^
            "%SetupScript%"

      - name: Move artifact.
        if: (env.UPLOAD_ARTIFACT == 'true') || (github.ref == 'refs/heads/nightly')
        shell: bash
        run: |
          OUT=$TBUILD/$REPO_NAME/out/Release
          mkdir -p artifact
          
          # Copy executables
          cp "$OUT/Telegram.exe" artifact/
          cp "$OUT/Updater.exe" artifact/
          
          # Copy installer if it exists (only for standard builds without generator)
          if [ "${{ matrix.generator }}" == "" ]; then
            APP_VERSION_STR_FULL="${{ env.APP_VERSION_STR_FULL }}"
            if [ "${{ matrix.arch }}" == "x64" ]; then
              if [ -f "$OUT/tsetup-x64.$APP_VERSION_STR_FULL.exe" ]; then
                cp "$OUT/tsetup-x64.$APP_VERSION_STR_FULL.exe" "artifact/MyTelegram-Setup-x64-$APP_VERSION_STR_FULL.exe"
              fi
            else
              if [ -f "$OUT/tsetup.$APP_VERSION_STR_FULL.exe" ]; then
                cp "$OUT/tsetup.$APP_VERSION_STR_FULL.exe" "artifact/MyTelegram-Setup-$APP_VERSION_STR_FULL.exe"
              fi
            fi
          fi
          
          # Copy d3d compiler if it exists
          if [ -d "$OUT/modules" ]; then
            cp -r "$OUT/modules" artifact/
          fi

      - uses: actions/upload-artifact@v5
        name: Upload artifact.
        if: (env.UPLOAD_ARTIFACT == 'true') || (github.ref == 'refs/heads/nightly')
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact\
