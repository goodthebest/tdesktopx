name: Windows Build (MyTelegram x64)

on:
  workflow_dispatch:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 240

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Fix mytelegram.ico (convert PNG -> ICO if needed)
        shell: pwsh
        run: |
          $ico = Join-Path $env:GITHUB_WORKSPACE "mytelegram.ico"
          if (Test-Path $ico) {
            $bytes = [System.IO.File]::ReadAllBytes($ico)
            if ($bytes.Length -ge 8) {
              $isPng = ($bytes[0] -eq 0x89 -and $bytes[1] -eq 0x50 -and $bytes[2] -eq 0x4E -and $bytes[3] -eq 0x47)
              if ($isPng) {
                Write-Host "mytelegram.ico is actually a PNG. Converting to real .ico..."
                choco install imagemagick -y --no-progress
                $tmp = Join-Path $env:RUNNER_TEMP "mytelegram_converted.ico"
                magick $ico -background none -define icon:auto-resize=256,128,64,48,32,16 $tmp
                Move-Item -Force $tmp $ico
              } else {
                Write-Host "mytelegram.ico already looks like an ICO."
              }
            } else {
              Write-Host "mytelegram.ico is too small/unexpected; skipping."
            }
          } else {
            Write-Host "No mytelegram.ico found at repo root; skipping."
          }

      - name: Enable long paths
        shell: pwsh
        run: git config --system core.longpaths true

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup MSVC environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Optional but strongly recommended: cache prepared deps
      - name: Cache ThirdParty + Libraries
        uses: actions/cache@v4
        with:
          path: |
            ThirdParty
            Libraries
            Libraries/win64
          key: win64-deps-${{ runner.os }}-${{ hashFiles('Telegram/build/prepare/**', 'Telegram/build/qt_version.py', '.gitmodules') }}

      - name: Prepare libraries (win.bat)
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%"
          Telegram\build\prepare\win.bat

      - name: Configure (x64) - generates out\Telegram.sln
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\Telegram"
          configure.bat x64

      - name: Build (Release)
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%"
          if not exist out\Telegram.sln (
            echo ERROR: out\Telegram.sln not found
            exit /b 1
          )
          msbuild out\Telegram.sln /m /p:Configuration=Release /p:Platform=x64

      - name: List outputs
        shell: pwsh
        run: |
          if (Test-Path "out\Release") {
            Get-ChildItem -Recurse out\Release -Include *.exe,*.dll | Select-Object FullName,Length
          } else {
            Write-Host "out\Release not found; listing out\"
            Get-ChildItem -Recurse out | Select-Object FullName,Length
          }

      - name: Upload artifacts (Release)
        uses: actions/upload-artifact@v4
        with:
          name: mytelegram-windows-x64-release
          path: |
            out/Release/**/*
          if-no-files-found: error
