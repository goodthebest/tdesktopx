name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6 (MSVC x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.5.3"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2019_64"
          cache: true

      - name: Setup vcpkg + install deps
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (!(Test-Path ".\vcpkg")) {
            git clone https://github.com/microsoft/vcpkg .\vcpkg
          }
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg.exe install vulkan-headers:x64-windows ada-url:x64-windows boost:x64-windows
          Write-Host "=== vcpkg installed share dirs ==="
          Get-ChildItem .\vcpkg\installed\x64-windows\share -Directory | Select-Object Name

      - name: Configure (MSVC + vcpkg)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $toolchain = "$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake"
          $vcpkgRoot = "$env:GITHUB_WORKSPACE\vcpkg\installed\x64-windows"
          $qtPrefix = "$env:Qt6_DIR"
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DCMAKE_PREFIX_PATH="$qtPrefix;$vcpkgRoot" `
            -DVulkan_INCLUDE_DIR="$vcpkgRoot\include"

      - name: Build (Release)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake --build build --config Release

      - name: List outputs
        shell: pwsh
        run: |
          Get-ChildItem -Recurse build -Include *.exe,*.dll | Select-Object FullName,Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tdesktopx-windows-release
          path: |
            build/**/*.exe
            build/**/*.dll
