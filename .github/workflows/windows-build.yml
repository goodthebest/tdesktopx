name: Windows Build (MyTelegram)

on:
  workflow_dispatch:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Git long paths
        shell: pwsh
        run: |
          git config --system core.longpaths true

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 1) Prepare third-party libs (Qt/FFmpeg/etc) using repo script
      - name: Prepare libraries (win.bat)
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%"
          Telegram\build\prepare\win.bat

      # 2) Generate Visual Studio solution using repo script
      - name: Configure (generate out\Telegram.sln)
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\Telegram"
          configure.bat

      # 3) Build Release via MSBuild
      - name: Build (Release)
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%"
          if not exist out\Telegram.sln (
            echo ERROR: out\Telegram.sln not found
            exit /b 1
          )
          msbuild out\Telegram.sln /m /p:Configuration=Release /p:Platform=x64

      - name: List outputs
        shell: pwsh
        run: |
          if (Test-Path "out\Release") {
            Get-ChildItem -Recurse out\Release | Select-Object FullName,Length
          } else {
            Write-Host "out\Release not found. Listing out folder:"
            Get-ChildItem -Recurse out | Select-Object FullName,Length
          }

      - name: Upload artifacts (Release)
        uses: actions/upload-artifact@v4
        with:
          name: mytelegram-windows-release
          path: |
            out/Release/**/*
            out/Release/Telegram.exe
            out/Release/*.dll
          if-no-files-found: error
